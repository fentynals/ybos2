<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YBOS DEV — Thumbnail Tester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --rbx-bg: #191b1d;
    --rbx-surface: #232527;
    --rbx-surface2: #2e3134;
    --rbx-line: #3b3f43;
    --rbx-text: #ffffff;
    --rbx-dim: #bdbebe;
    --rbx-green: #00b06f;
    --rbx-blue: #0077ff;
    --y-bg: #0b0c10;
    --y-line: #22242c;
    --y-dim: #8b93a7;
    --y-gold: #ffd23e;
    --y-green: #1d9b4e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--rbx-bg); color: var(--rbx-text);
    font-family: Montserrat, "Builder Sans", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============================ ybos dev bar ============================ */
  #devbar {
    position: sticky; top: 0; z-index: 500;
    background: var(--y-bg); border-bottom: 1px solid var(--y-line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 9px 14px; font-size: 12.5px; color: #e8ecf4;
  }
  #devbar.hidden { display: none; }
  #devbar h1 {
    margin: 0; font-size: 13px; letter-spacing: 1.5px; color: var(--y-gold);
    font-weight: 700; white-space: nowrap;
  }
  #devbar .sep { width: 1px; height: 22px; background: var(--y-line); }
  #devbar label { color: var(--y-dim); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #devbar input[type=text], #devbar input[type=number] {
    background: #101218; color: #e8ecf4; border: 1px solid var(--y-line);
    border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px;
  }
  #devbar input[type=text] { width: 130px; }
  #devbar input[type=number] { width: 74px; }
  .ybtn {
    background: var(--y-green); color: #fff; border: 0; border-radius: 6px;
    padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; letter-spacing: .4px; white-space: nowrap;
  }
  .ybtn:hover { filter: brightness(1.15); }
  .ybtn.ghost { background: #1a1d26; border: 1px solid var(--y-line); color: #c9cfdd; }
  .ybtn.gold { background: var(--y-gold); color: #14161c; }
  #modes { display: flex; gap: 6px; }
  .ybtn.mode.on { background: var(--y-gold); color: #14161c; border-color: var(--y-gold); }
  .toggle {
    display: flex; align-items: center; gap: 5px; cursor: pointer;
    background: #1a1d26; border: 1px solid var(--y-line); border-radius: 6px;
    padding: 6px 9px; color: #c9cfdd; user-select: none; font-size: 12px;
  }
  .toggle.on { background: #1f2a20; border-color: #2f6b3c; color: #b8f5c4; }
  .toggle input { display: none; }
  #tray { display: flex; align-items: center; gap: 6px; }
  #tray .slot {
    width: 52px; height: 40px; border-radius: 6px; border: 2px solid var(--y-line);
    background: #101218 center/cover no-repeat; cursor: pointer; position: relative; flex: 0 0 auto;
  }
  #tray .slot.active { border-color: var(--y-gold); }
  #tray .slot .tag {
    position: absolute; bottom: -1px; left: -1px; right: -1px; font-size: 8px; text-align: center;
    background: rgba(0,0,0,.72); color: #c9cfdd; letter-spacing: .5px; border-radius: 0 0 4px 4px;
  }
  #tray .slot .x {
    position: absolute; top: -6px; right: -6px; width: 16px; height: 16px;
    border-radius: 50%; background: #c0392b; color: #fff; font-size: 11px; line-height: 16px;
    text-align: center; display: none; border: 0; cursor: pointer; padding: 0;
  }
  #tray .slot:hover .x { display: block; }
  #drop {
    border: 1px dashed #39404f; border-radius: 6px; padding: 6px 10px;
    color: var(--y-dim); cursor: pointer; font-size: 12px; white-space: nowrap;
  }
  #drop:hover { border-color: var(--y-gold); color: var(--y-gold); }
  #hint { color: var(--y-dim); font-size: 11.5px; }
  #showbar { position: fixed; top: 8px; right: 8px; z-index: 600; display: none; }
  body.barhidden #showbar { display: block; }

  /* ============================ roblox chrome ============================ */
  #page { }
  body.squint #page { filter: blur(3.5px); }
  body.gray #page { filter: grayscale(1); }
  body.squint.gray #page { filter: blur(3.5px) grayscale(1); }

  .rbx-top {
    height: 44px; background: #1b1d1e; display: flex; align-items: center; gap: 0;
    padding: 0 16px; position: relative; z-index: 300;
  }
  .wordmark {
    font-weight: 700; font-size: 17px; letter-spacing: -.4px; color: #fff; margin-right: 34px;
    display: flex; align-items: center; gap: 6px;
  }
  .topnav { display: flex; align-items: center; gap: 0; }
  .topnav a { color: #fff; font-size: 13.5px; font-weight: 500; text-decoration: none; padding: 0 30px; }
  .topsearch {
    flex: 0 1 340px; margin-left: 26px; height: 30px; background: #2e3134; border-radius: 6px;
    display: flex; align-items: center; gap: 8px; padding: 0 10px; color: #9a9d9f; font-size: 13px;
  }
  .rbx-top .grow { flex: 1 1 auto; }
  .topicons { display: flex; align-items: center; gap: 17px; }
  .topicons .rbx-badge { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #fff; }
  .topav { width: 26px; height: 26px; border-radius: 5px; background: linear-gradient(140deg,#5a5d60,#303335); }

  .rbx-shell { display: flex; align-items: flex-start; }
  .rbx-side {
    position: sticky; top: 0; flex: 0 0 195px; height: calc(100vh - 44px);
    background: var(--rbx-bg); padding: 10px 10px; overflow-y: auto;
  }
  .rbx-side::-webkit-scrollbar { width: 6px; }
  .rbx-side::-webkit-scrollbar-thumb { background: #3b3f43; border-radius: 3px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px;
    color: #fff; font-size: 13.5px; font-weight: 500; cursor: default;
  }
  .nav-item .glyph { width: 17px; height: 17px; flex: 0 0 17px; opacity: .9; }
  .nav-item.active { background: var(--rbx-surface2); }
  .nav-item:hover { background: #26292b; }
  .nav-item .badge {
    margin-left: auto; background: #6e7274; color: #fff; font-size: 10.5px; font-weight: 700;
    border-radius: 9px; padding: 1px 7px;
  }
  .rbx-main { flex: 1 1 auto; min-width: 0; padding: 16px 26px 70px; position: relative; }
  .rbx-main h1.page { margin: 0 0 14px; font-size: 26px; font-weight: 700; }

  /* section heads */
  .sec { margin-bottom: 26px; }
  .sec-head { display: flex; align-items: center; gap: 7px; margin-bottom: 11px; }
  .sec-head h2 { margin: 0; font-size: 16.5px; font-weight: 700; }
  .sec-head .arrow { font-size: 15px; color: #fff; }
  .sec-head .info { margin-left: auto; color: #8f9295; font-size: 13px; }
  .sec-head .seeall { margin-left: auto; color: #fff; font-size: 13px; font-weight: 600; }
  .sub { color: #8f9295; font-size: 11.5px; margin: -7px 0 10px; }

  /* filter pills (charts) */
  .pills { display: flex; gap: 9px; margin-bottom: 18px; }
  .pill {
    background: var(--rbx-surface2); border-radius: 16px; padding: 6px 14px;
    font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px;
  }

  /* ---- stat line: thumbs-up % + player count (this is what Roblox shows) ---- */
  .stats { display: flex; align-items: center; gap: 10px; margin-top: 4px; color: var(--rbx-dim); font-size: 11.5px; font-weight: 500; }
  .stats .s { display: flex; align-items: center; gap: 3px; }
  .stats svg { opacity: .85; }

  /* ---- CHARTS: square icon tiles ---- */
  .icons { display: grid; grid-auto-flow: column; grid-auto-columns: var(--icw); gap: 10px; overflow: hidden; }
  .icard { width: var(--icw); }
  .icard .art { width: 100%; aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; background: #2b2e30; }
  .icard .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .icard .name {
    margin-top: 6px; font-size: 12.5px; font-weight: 600; line-height: 1.28; color: #fff;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.56em;
  }

  /* ---- HOME: big 16:9 recommendation cards ---- */
  .bigs { display: grid; grid-template-columns: repeat(var(--bigcols), minmax(0,1fr)); gap: 14px 14px; }
  .bcard { min-width: 0; }
  .bcard .art { width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; background: #2b2e30; }
  .bcard .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .bcard .name {
    margin-top: 7px; font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  /* continue row: same 16:9 card, denser */
  .strip169 { display: grid; grid-auto-flow: column; grid-auto-columns: var(--contw); gap: 11px; overflow: hidden; }

  .mine.flagged .art { outline: 3px solid var(--y-gold); outline-offset: 2px; }
  .mine.flagged .name { color: var(--y-gold); }

  /* friends row */
  .friends { display: grid; grid-auto-flow: column; grid-auto-columns: 74px; gap: 12px; overflow: hidden; }
  .fr { text-align: center; }
  .fr .av { width: 66px; height: 66px; border-radius: 50%; margin: 0 auto; position: relative; }
  .fr .nm { margin-top: 6px; font-size: 11.5px; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .st { font-size: 10px; color: #8f9295; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fr .dotg { position: absolute; right: 2px; bottom: 2px; width: 15px; height: 15px; border-radius: 4px; background: var(--rbx-green); border: 2px solid var(--rbx-bg); }

  /* most-played panel */
  .mostplayed {
    position: absolute; top: 16px; right: 26px; width: 400px; background: var(--rbx-surface);
    border-radius: 10px; padding: 10px 12px;
  }
  .mostplayed .t { font-size: 12.5px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .mostplayed .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mostplayed .it .a { width: 100%; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: #2b2e30; }
  .mostplayed .it img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mostplayed .it .n { font-size: 10px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mostplayed .it .h { font-size: 9.5px; color: #8f9295; }

  /* ===================== experience (game detail) page ===================== */
  .exp-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
  .exp-icon { width: 62px; height: 62px; border-radius: 12px; overflow: hidden; background: #2b2e30; flex: 0 0 62px; }
  .exp-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .exp-titles h1 { margin: 0; font-size: 25px; font-weight: 700; line-height: 1.15; }
  .exp-by { margin-top: 6px; color: var(--rbx-dim); font-size: 13.5px; display: flex; align-items: center; gap: 5px; }
  .verified { width: 15px; height: 15px; border-radius: 50%; background: var(--rbx-blue); display: inline-flex;
    align-items: center; justify-content: center; font-size: 10px; color: #fff; font-weight: 700; }
  .exp-grid { display: grid; grid-template-columns: minmax(0, 1fr) 316px; gap: 22px; align-items: start; }
  .exp-hero { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #2b2e30; position: relative; }
  .exp-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .exp-hero .navb {
    position: absolute; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: #fff; border: 0; font-size: 17px; cursor: pointer; line-height: 36px;
  }
  .exp-hero .navb.l { left: 10px; } .exp-hero .navb.r { right: 10px; }
  .exp-hero.mine.flagged { outline: 3px solid var(--y-gold); outline-offset: 2px; }
  .exp-strip { display: flex; gap: 8px; margin-top: 10px; flex-wrap: nowrap; overflow: hidden; }
  .exp-strip .th {
    width: 104px; flex: 0 0 104px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden;
    cursor: pointer; opacity: .55; border: 2px solid transparent; background: #2b2e30;
  }
  .exp-strip .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .exp-strip .th.active { opacity: 1; border-color: #fff; }
  .exp-strip .th.mine.flagged { border-color: var(--y-gold); opacity: 1; }
  .play-btn {
    width: 100%; background: var(--rbx-green); color: #fff; border: 0; border-radius: 8px;
    padding: 14px 0; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .side-row { display: flex; gap: 8px; margin-top: 10px; }
  .side-row .sq {
    flex: 1 1 0; background: var(--rbx-surface2); border-radius: 8px; padding: 10px 0;
    text-align: center; color: #d5d6d7; font-size: 13px; font-weight: 600;
  }
  .exp-stats { margin-top: 16px; background: var(--rbx-surface); border-radius: 10px; padding: 4px 14px; }
  .exp-stats .r { display: flex; justify-content: space-between; padding: 9px 0; font-size: 13.5px; border-bottom: 1px solid var(--rbx-line); }
  .exp-stats .r:last-child { border-bottom: 0; }
  .exp-stats .k { color: var(--rbx-dim); }
  .exp-stats .v { font-weight: 600; }
  .likebar { margin-top: 14px; }
  .likebar .track { height: 5px; border-radius: 3px; background: #e0453e; overflow: hidden; }
  .likebar .fill { height: 100%; background: var(--rbx-green); }
  .likebar .lbl { display: flex; justify-content: space-between; color: var(--rbx-dim); font-size: 12.5px; margin-top: 6px; }
  .exp-tabs { display: flex; gap: 22px; margin: 22px 0 12px; border-bottom: 1px solid var(--rbx-line); }
  .exp-tabs span { padding-bottom: 9px; font-size: 14px; font-weight: 600; color: var(--rbx-dim); }
  .exp-tabs span.on { color: #fff; box-shadow: inset 0 -2px 0 #fff; }
  .exp-desc { color: #d5d6d7; font-size: 13.5px; line-height: 1.6; max-width: 760px; white-space: pre-wrap; }
  @media (max-width: 900px) { .exp-grid { grid-template-columns: minmax(0,1fr); } }

  .fallback { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; color: #fff; text-align: center; padding: 8px; line-height: 1.15; }

  body.mobile .rbx-side { display: none; }
  body.mobile .rbx-main { padding: 14px 12px 60px; }
  body.mobile .mostplayed { display: none; }
  body.mobile .exp-grid { grid-template-columns: minmax(0,1fr); }
</style>
</head>
<body>

<div id="devbar">
  <h1>YBOS DEV &middot; THUMBNAIL TESTER</h1>
  <div class="sep"></div>
  <div id="modes">
    <button class="ybtn ghost mode on" data-mode="home">HOME</button>
    <button class="ybtn ghost mode" data-mode="charts">CHARTS</button>
    <button class="ybtn ghost mode" data-mode="exp">EXPERIENCE</button>
  </div>
  <div class="sep"></div>
  <div id="tray"></div>
  <div id="drop">+ add art <span style="opacity:.6">(click / drop / paste)</span></div>
  <input type="file" id="file" accept="image/*" multiple hidden>
  <div class="sep"></div>
  <label>name <input type="text" id="gname" value="HEAD TAP" spellcheck="false"></label>
  <label>playing <input type="number" id="gplaying" value="1200" min="0" step="1"></label>
  <label>like% <input type="number" id="glike" value="92" min="0" max="100" step="1"></label>
  <div class="sep"></div>
  <button class="ybtn gold" id="rand">RANDOMIZE</button>
  <label class="toggle" id="t-flag"><input type="checkbox">find mine</label>
  <label class="toggle" id="t-squint"><input type="checkbox">squint</label>
  <label class="toggle" id="t-gray"><input type="checkbox">gray</label>
  <label class="toggle" id="t-mobile"><input type="checkbox">mobile</label>
  <button class="ybtn ghost" id="hide">HIDE BAR (H)</button>
  <span id="hint"></span>
</div>
<button class="ybtn gold" id="showbar">SHOW DEV BAR (H)</button>

<div id="page">
  <div class="rbx-top">
    <div class="wordmark">
      <svg width="19" height="19" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="4.6" y="0" width="23" height="23" rx="1.4" transform="rotate(14 16 16)" fill="#fff"/>
        <rect x="12.4" y="11.2" width="8" height="8" rx=".8" transform="rotate(14 16 16)" fill="#1b1d1e"/>
      </svg>
      ROBLOX
    </div>
    <div class="topnav">
      <a href="#" data-nav="home">Home</a>
      <a href="#" data-nav="charts">Charts</a>
      <a href="#">Marketplace</a>
      <a href="#">Create</a>
    </div>
    <div class="topsearch">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9a9d9f" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <span>Search</span>
    </div>
    <div class="grow"></div>
    <div class="topicons">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22zm7-6v-5a7 7 0 0 0-5.3-6.8V3a1.7 1.7 0 1 0-3.4 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M9 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20c0-3 3.5-5 7-5s7 2 7 5v1H2zm15.5-4.6c2.6.6 4.5 2.2 4.5 4.6v1h-4z"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="#fff"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z"/></svg>
      <span class="rbx-badge">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#fff"><path d="M5 3h10l4 4v10l-4 4H5L1 17V7z"/></svg>
        23K
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm9.4 4c0-.6-.1-1.2-.2-1.8l2-1.5-2-3.4-2.3 1a7.7 7.7 0 0 0-3-1.8L15.5 2h-4l-.4 2.5a7.7 7.7 0 0 0-3 1.8l-2.3-1-2 3.4 2 1.5a7.6 7.6 0 0 0 0 3.6l-2 1.5 2 3.4 2.3-1a7.7 7.7 0 0 0 3 1.8l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 3-1.8l2.3 1 2-3.4-2-1.5c.1-.6.2-1.2.2-1.8z"/></svg>
      <div class="topav"></div>
    </div>
  </div>

  <div class="rbx-shell">
    <nav class="rbx-side" id="side"></nav>
    <main class="rbx-main" id="main"></main>

<script>
"use strict";

/* =====================================================================
   YBOS DEV — thumbnail tester
   Rebuilds the three Roblox surfaces that show your art, in the formats
   Roblox actually uses (checked against the live site):
     HOME       — "Recommended For You" grid of BIG 16:9 thumbnails,
                  plus a "Continue" strip of 16:9 cards.
     CHARTS     — the sort rows (Top Trending, Up-and-Coming, ...) as
                  SQUARE ICON tiles with a  thumbs-up % + player count line.
     EXPERIENCE — the game page, where the 16:9 art is shown full size.
   Data (names / icons / 16:9 art / players / votes) is real, pulled from
   Roblox's explore + thumbnails APIs.
   ===================================================================== */

var DATA = JSON.parse(document.getElementById("gamedata").textContent);
var GAMES = {};
DATA.games.forEach(function (g) { GAMES[g.id] = g; });

var LS_IMGS = "ybos.dev.thumbs";
var LS_CFG = "ybos.dev.cfg";
var MAX_IMGS = 8;

var state = {
  imgs: [],        // { src, w, h }
  active: 0,
  name: "HEAD TAP",
  playing: 1200,
  like: 92,
  seed: 1,
  mode: "home",
  myRow: 0,        // charts: which sort row
  myPos: 3,        // charts: slot in that row
  myBig: 4,        // home: index in the Recommended grid
  expHero: 0
};

/* ---------------------------------------------------------------- storage */
function loadState() {
  try {
    var i = JSON.parse(localStorage.getItem(LS_IMGS) || "[]");
    if (Array.isArray(i)) {
      state.imgs = i.slice(0, MAX_IMGS).map(function (v) {
        return typeof v === "string" ? { src: v, w: 0, h: 0 } : v;
      });
    }
  } catch (e) { /* corrupt entry -- start clean */ }
  try {
    var c = JSON.parse(localStorage.getItem(LS_CFG) || "{}");
    if (c && typeof c === "object") {
      if (typeof c.name === "string") state.name = c.name;
      if (typeof c.playing === "number") state.playing = c.playing;
      if (typeof c.like === "number") state.like = c.like;
      if (typeof c.active === "number") state.active = c.active;
      if (c.mode === "home" || c.mode === "charts" || c.mode === "exp") state.mode = c.mode;
    }
  } catch (e) { /* ignore */ }
}
function saveImgs() {
  try { localStorage.setItem(LS_IMGS, JSON.stringify(state.imgs)); }
  catch (e) { setHint("storage full — remove an image"); }
}
function saveCfg() {
  try {
    localStorage.setItem(LS_CFG, JSON.stringify({
      name: state.name, playing: state.playing, like: state.like,
      active: state.active, mode: state.mode
    }));
  } catch (e) { /* ignore */ }
}

/* ------------------------------------------------------------- seeded rng */
function rng(seed) {
  var s = seed >>> 0;
  return function () {
    s = (s * 1664525 + 1013904223) >>> 0;
    return s / 4294967296;
  };
}
function shuffled(arr, rand) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(rand() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ------------------------------------------------------------- formatting */
function fmtCount(n) {
  n = Number(n) || 0;
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function likePct(g) {
  if (g.rating && g.down !== null && g.down !== undefined && (g.rating + g.down) > 0) {
    return Math.round(g.rating / (g.rating + g.down) * 100);
  }
  var h = 0, s = String(g.name || "");
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000;
  return 76 + (h % 22);
}

/* ----------------------------------------------------------- image import */
function downscale(dataUrl, cb) {
  var im = new Image();
  im.onload = function () {
    var max = 640;
    var w = im.width, h = im.height;
    var scale = Math.min(1, max / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * scale));
    c.height = Math.max(1, Math.round(h * scale));
    c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
    var out;
    try { out = c.toDataURL("image/jpeg", 0.88); } catch (e) { out = dataUrl; }
    cb({ src: out, w: w, h: h });
  };
  im.onerror = function () { cb({ src: dataUrl, w: 0, h: 0 }); };
  im.src = dataUrl;
}
function addFile(file) {
  if (!file || !/^image\//.test(file.type)) return;
  var fr = new FileReader();
  fr.onload = function () {
    downscale(String(fr.result), function (rec) {
      state.imgs.unshift(rec);
      if (state.imgs.length > MAX_IMGS) state.imgs.length = MAX_IMGS;
      state.active = 0;
      saveImgs(); saveCfg(); renderTray(); render();
      setHint("added " + kindOf(rec) + " — hit RANDOMIZE");
    });
  };
  fr.readAsDataURL(file);
}
function kindOf(rec) {
  if (!rec || !rec.w || !rec.h) return "art";
  var r = rec.w / rec.h;
  if (r > 1.45) return "16:9";
  if (r < 1.15) return "icon";
  return "art";
}

/* ------------------------------------------------------------------- tray */
function renderTray() {
  var tray = document.getElementById("tray");
  tray.textContent = "";
  state.imgs.forEach(function (rec, i) {
    var d = document.createElement("div");
    d.className = "slot" + (i === state.active ? " active" : "");
    d.style.backgroundImage = "url(" + rec.src + ")";
    d.title = "use this image";
    d.addEventListener("click", function () {
      state.active = i; saveCfg(); renderTray(); render();
    });
    var tg = document.createElement("div");
    tg.className = "tag";
    tg.textContent = kindOf(rec);
    d.appendChild(tg);
    var x = document.createElement("button");
    x.className = "x"; x.textContent = "×"; x.title = "remove";
    x.addEventListener("click", function (e) {
      e.stopPropagation();
      state.imgs.splice(i, 1);
      if (state.active >= state.imgs.length) state.active = Math.max(0, state.imgs.length - 1);
      saveImgs(); saveCfg(); renderTray(); render();
    });
    d.appendChild(x);
    tray.appendChild(d);
  });
}

/* ------------------------------------------------------------------- art */
function artNode(src, label, cls) {
  var wrap = document.createElement("div");
  wrap.className = "art";
  if (src) {
    var img = document.createElement("img");
    img.src = src;
    img.alt = label;
    img.addEventListener("error", function () {
      wrap.textContent = "";
      wrap.appendChild(fallbackNode(label));
    });
    wrap.appendChild(img);
  } else {
    wrap.appendChild(fallbackNode(label));
  }
  return wrap;
}
function fallbackNode(label) {
  var f = document.createElement("div");
  f.className = "fallback";
  var h = 0;
  for (var i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) % 360;
  f.style.background = "linear-gradient(140deg,hsl(" + h + ",62%,42%),hsl(" + ((h + 40) % 360) + ",62%,26%))";
  f.textContent = label.slice(0, 18);
  return f;
}

function cardNode(game, isMine, shape) {
  // shape: "icon" (square, charts) | "big" (16:9, home recommended/continue)
  var el = document.createElement("div");
  el.className = (shape === "icon" ? "icard" : "bcard") + (isMine ? " mine" : "") + (isMine && flagOn() ? " flagged" : "");
  var src = isMine ? myImage() : (shape === "icon" ? game.icon : (game.thumb || game.icon));
  var label = isMine ? state.name : game.name;
  el.appendChild(artNode(src, label));
  var n = document.createElement("div");
  n.className = "name";
  n.textContent = label;
  el.appendChild(n);
  el.appendChild(statsNode(isMine ? state.like : likePct(game), isMine ? state.playing : game.playing));

  var main = document.getElementById("main");
  var w = main.clientWidth || 1000;
  return Math.max(2, Math.floor((w + gap) / (target + gap)));
}

function randomize() {
  state.seed = (Math.random() * 4294967295) >>> 0;
  var r = rng(state.seed);
  if (state.mode === "exp") {
    state.expHero = state.imgs.length ? Math.floor(r() * state.imgs.length) : 0;
    render();
    setHint(myImage() ? ("big slot: image " + (state.expHero + 1) + " of " + state.imgs.length) : "add an image first");
    return;
  }
  if (state.mode === "charts") {
    state.myRow = Math.floor(r() * DATA.rows.length);
    state.myPos = Math.floor(r() * 12);
    render();
    var rowName = DATA.rows[state.myRow] ? DATA.rows[state.myRow].title : "";
    setHint(myImage() ? ("icon placed in “" + rowName + "”") : "add an image first");
    return;
  }
  state.myBig = Math.floor(r() * 12);
  render();
  setHint(myImage() ? "thumbnail moved in Recommended For You" : "add an image first");
}

function setMode(m) {
  state.mode = m;
  saveCfg();
  var btns = document.querySelectorAll("#modes .mode");
  for (var i = 0; i < btns.length; i++) {
    btns[i].classList.toggle("on", btns[i].getAttribute("data-mode") === m);
  }
  render();
}

function wireToggle(id, cls) {
  var el = document.getElementById(id);
  var input = el.querySelector("input");
  // bind the INPUT's change, never the label's click: the checkbox lives
  // inside the label, so a label click already toggles it natively --
  // doing it again by hand cancels out and the toggle does nothing.
  input.addEventListener("change", function () {
    el.classList.toggle("on", input.checked);
    if (cls) document.body.classList.toggle(cls, input.checked);
    render();
  });
}

function init() {
  loadState();
  document.getElementById("gname").value = state.name;
  document.getElementById("gplaying").value = state.playing;
  document.getElementById("glike").value = state.like;
  renderTray();

  document.getElementById("rand").addEventListener("click", randomize);
  var modeBtns = document.querySelectorAll("#modes .mode");
  for (var mi = 0; mi < modeBtns.length; mi++) {
    (function (b) {
      b.addEventListener("click", function () { setMode(b.getAttribute("data-mode")); });
    })(modeBtns[mi]);
  }
  // the real top nav switches surfaces too
  var navs = document.querySelectorAll(".topnav a[data-nav]");
  for (var ni = 0; ni < navs.length; ni++) {
    (function (a) {
      a.addEventListener("click", function (e) { e.preventDefault(); setMode(a.getAttribute("data-nav")); });
    })(navs[ni]);
  }

  wireToggle("t-flag", null);
  wireToggle("t-squint", "squint");
  wireToggle("t-gray", "gray");
  wireToggle("t-mobile", "mobile");

  document.getElementById("gname").addEventListener("input", function (e) {
    state.name = e.target.value || "HEAD TAP"; saveCfg(); render();
  });
  document.getElementById("gplaying").addEventListener("input", function (e) {
    state.playing = Math.max(0, parseInt(e.target.value, 10) || 0); saveCfg(); render();
  });
  document.getElementById("glike").addEventListener("input", function (e) {
    state.like = Math.min(100, Math.max(0, parseInt(e.target.value, 10) || 0)); saveCfg(); render();
  });

  var file = document.getElementById("file");
  document.getElementById("drop").addEventListener("click", function () { file.click(); });
  file.addEventListener("change", function (e) {
    Array.prototype.slice.call(e.target.files).forEach(addFile);
    file.value = "";
  });
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files) {
      Array.prototype.slice.call(e.dataTransfer.files).forEach(addFile);
    }
  });
  window.addEventListener("paste", function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image") === 0) addFile(items[i].getAsFile());
    }
  });

  function toggleBar() {
    document.body.classList.toggle("barhidden");
    document.getElementById("devbar").classList.toggle("hidden");
    render();
  }
  document.getElementById("hide").addEventListener("click", toggleBar);
  document.getElementById("showbar").addEventListener("click", toggleBar);
  window.addEventListener("keydown", function (e) {
    var t = e.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA") return;
    if (e.key === "h" || e.key === "H") toggleBar();
    if (e.key === "r" || e.key === "R") randomize();
  });

  var rt = null;
  window.addEventListener("resize", function () {
    if (rt) clearTimeout(rt);
    rt = setTimeout(render, 120);
  });

  setMode(state.mode);
}
init();
</script>
</body>
</html>
